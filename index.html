<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이환 가챠 트래커</title>
<link rel="icon" href="icons/c-nanally.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar with banner switch; summary (pity gauge + stats) → pickup history bars → full log. Dark tracker look. */
:root {
  color-scheme: dark;
  --bg: #0a0d13;
  --surface: #121722;
  --surface-2: #19202e;
  --line: #242c3d;
  --fg: #e7eaf2;
  --muted: #8b94a9;
  --dim: #5d667b;
  --gold: #f3c252;
  --gold-soft: rgba(243, 194, 82, .14);
  --rose: #d97bea;
  --rose-soft: rgba(217, 123, 234, .14);
  --blue: #6c7fa6;
  --accent: #58c7e0;
  --good: #4ccf8a;
  --warn: #f0a83c;
  --bad: #f0604d;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Chakra Petch", "IBM Plex Sans KR", ui-monospace, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 9px; border: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 14px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--gold); color: #1b1404; border-color: var(--gold); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }

.main { padding-block: 22px 60px; display: grid; gap: 22px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; color: var(--muted); }
.notice b { color: var(--fg); }

/* summary */
.summary { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.label { font-size: 11.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.pity-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pity-big { font-family: var(--font-num); font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.pity-big small { font-size: 22px; color: var(--dim); font-weight: 600; margin-left: 4px; }
.pity-left { text-align: right; color: var(--muted); }
.pity-left b { display: block; color: var(--fg); font-family: var(--font-num); font-size: 20px; }
.gauge { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; margin-top: 18px; overflow: hidden; border: 1px solid var(--line); }
.gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, var(--good), var(--warn) 75%, var(--bad)); background-size: var(--full, 100%) 100%; }
.gauge-marks { position: relative; height: 18px; font-size: 11px; color: var(--dim); font-family: var(--font-num); }
.gauge-marks span { position: absolute; top: 3px; transform: translateX(-50%); }
.gauge-marks span:first-child { transform: none; }
.gauge-marks span:last-child { transform: translateX(-100%); }
.soft-tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .35; }
.journey { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; min-width: 0; }
.stat b { display: block; font-family: var(--font-num); font-size: 24px; font-weight: 600; line-height: 1.2; margin-top: 4px; }
.stat em { font-style: normal; color: var(--muted); font-size: 12px; }
.stat.gold b { color: var(--gold); }
.stat.rose b { color: var(--rose); }

/* section heads */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance; }
.sec-head p { margin: 0; color: var(--muted); font-size: 12.5px; }

/* pickup history */
.pulls { display: grid; gap: 6px; }
.pull { display: grid; grid-template-columns: 44px minmax(0, 170px) minmax(0, 1fr) 52px; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pull .who { min-width: 0; }
.pull .who b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pull .who span { color: var(--dim); font-size: 12px; font-family: var(--font-num); }
.bar { position: relative; height: 22px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; opacity: .9; }
.bar .chips { position: absolute; inset: 0; }
.bar .chip { position: absolute; top: 3px; bottom: 3px; width: 16px; transform: translateX(-50%); border-radius: 4px; background: var(--gold); box-shadow: 0 0 0 2px var(--surface-2); }
.bar .chip img { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; display: block; }
.pity-badge { font-family: var(--font-num); font-weight: 700; font-size: 18px; text-align: right; }
.pull.current { border-style: dashed; background: transparent; }
.pull.current .who b { color: var(--muted); }

.icon { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; flex: none; border: 1px solid var(--line); position: relative; }
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon .ph { font-weight: 700; font-size: 15px; color: var(--muted); }
.icon.S { border-color: var(--gold); background: var(--gold-soft); }
.icon.S .ph { color: var(--gold); }
.icon.A { border-color: color-mix(in srgb, var(--rose) 60%, transparent); background: var(--rose-soft); }
.icon.A .ph { color: var(--rose); }
.icon.sm { width: 30px; height: 30px; border-radius: 6px; }
.icon.sm .ph { font-size: 12px; }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
.tag.S { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 40%, transparent); background: var(--gold-soft); }
.tag .num { color: var(--fg); }

/* log */
.log-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; color: var(--muted); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: .05em; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.item { display: flex; align-items: center; gap: 10px; }
tr.S td.item span { color: var(--gold); font-weight: 500; }
tr.A td.item span { color: var(--rose); }
tr.B td.item span { color: var(--muted); }
tr.gift td { opacity: .55; }
.rk { font-family: var(--font-num); font-weight: 700; }
.rk.S { color: var(--gold); } .rk.A { color: var(--rose); } .rk.B { color: var(--blue); }
.muted { color: var(--muted); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }

.foot { color: var(--dim); font-size: 12px; }

@media (max-width: 820px) {
  .summary { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .pull { grid-template-columns: 40px minmax(0, 1fr) 44px; }
  .pull .bar { grid-column: 1 / -1; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pity-big { font-size: 46px; }
}
@media (prefers-reduced-motion: no-preference) {
  .gauge i, .bar i { transition: width .4s ease; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>이환 가챠 트래커</h1><span id="sync">기록 불러오는 중…</span></div>
    <div class="tabs" role="tablist" aria-label="배너">
      <button class="tab" role="tab" id="tab-char" aria-selected="true" data-banner="char">한정 보드 · 캐릭터</button>
      <button class="tab" role="tab" id="tab-arc" aria-selected="false" data-banner="arc">연구 모집 · 아크</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="notice" id="state-msg">
    <b>뽑기 기록을 불러오는 중이에요.</b>
  </div>

  <section class="summary" id="summary" hidden>
    <div class="panel">
      <div class="label" id="pity-label">현재 천장</div>
      <div class="pity-head" style="margin-top:8px">
        <div class="pity-big" id="pity-now">0<small>/ 90</small></div>
        <div class="pity-left"><span>확정까지</span><b id="pity-left">90회</b></div>
      </div>
      <div class="gauge" id="gauge"><i id="gauge-fill"></i></div>
      <div class="gauge-marks" id="gauge-marks"></div>
      <div class="journey" id="journey"></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="history-sec" hidden>
    <div class="sec-head"><h2 id="history-title">픽업 획득 기록</h2><p id="history-sub"></p></div>
    <div class="pulls" id="pulls"></div>
  </section>

  <section id="log-sec" hidden>
    <div class="sec-head">
      <h2>전체 뽑기 로그</h2>
      <div class="log-tools">
        <div class="seg" role="group" aria-label="등급 필터">
          <button type="button" data-rank="all" aria-pressed="true">전체</button>
          <button type="button" data-rank="S" aria-pressed="false">S</button>
          <button type="button" data-rank="A" aria-pressed="false">A</button>
          <button type="button" data-rank="B" aria-pressed="false">B</button>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>아이템</th><th>등급</th><th>천장</th><th>시간</th></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
    <div class="pager"><button class="btn" type="button" id="prev">← 최근</button><span id="page-info" class="num"></span><button class="btn" type="button" id="next">이전 →</button></div>
  </section>

  <p class="foot">천장 기준: 한정 보드 90회(70회부터 확률 상승), 연구 모집 80회. 포인트 선물로 받은 결과는 횟수에서 빠져요. 아이콘 출처: Icy Veins, Game8, GameWith. 개인용 비공식 팬 트래커예요.</p>
</main>

<script>
(() => {
  const BANNERS = {
    char: { name: "한정 보드", hard: 90, soft: 70, pickupWord: "캐릭터" },
    arc: { name: "연구 모집", hard: 80, soft: null, pickupWord: "전용 아크" },
  };
  const ICONS = {
    "나나리": "c-nanally.webp", "호토리": "c-hotori.webp", "라크리모사": "c-lacrimosa.webp", "카오스": "c-chaos.webp",
    "신쿠": "c-shinku.webp", "일로이": "c-iroi.webp", "잔홍": "c-zankou.webp", "링코": "c-linko.webp",
    "레이븐": "c-blackbird.webp", "아카네 린": "c-akane.webp", "민트": "c-mint.webp", "스키아": "c-skia.webp",
    "아들러": "c-adler.webp", "에드가": "c-edgar.webp", "하니엘": "c-haniel.webp",
    "준비 준비": "a-ready.png", "시간 밖으로의 행진": "a-marching.png", "마지막 장미": "a-lastrose.png",
    "만인의 갈망": "a-desired.png", "홍염의 신기루": "a-blushing.png", "금기의 문": "a-wronggate.png",
    "심장을 좀먹는 칼": "a-ravenous.png", "원행자의 목소리": "a-voyager.png", "죄와 벌": "a-crime.png",
    "달의 대척점": "a-moon.webp", "염혼의 질주": "a-raging.png", "동백꽃 모임": "a-camellia.png",
    "착한 강아지의 여행": "a-goodboy.png", "암흑 청춘의 망상": "a-youthful.png", "현실 도피처": "a-refuge.png",
    "물망산": "a-umbrella.png", "머리 조심": "a-heads.png", "잊힌 자": "a-forgotten.png", "잊혀진 자": "a-forgotten.png",
    "발도": "a-drawn.png", "위험한 게임": "a-dangerous.png", "미소 천사": "a-behappy.png", "우리": "a-us.png",
    "광란의 전자음악": "a-realmusic.png", "성공을 향한 첫 걸음": "a-firststep.png",
  };
  const PAGE = 50;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const short = (n) => (n || "").replace(/^(캐릭터|아크|아이템)·/, "");
  const isDice = (n) => short(n) === "진실의 주사위";

  let banner = "char";
  let rankFilter = "all";
  let page = 0;
  let docs = [];
  let loading = true;
  let loadError = false;
  let model = { char: null, arc: null };

  try { const b = localStorage.getItem("nte-banner"); if (b === "char" || b === "arc") banner = b; } catch (e) {}

  function icon(name, rank, sm) {
    const s = short(name);
    const file = ICONS[s];
    const cls = "icon " + (rank || "B") + (sm ? " sm" : "");
    if (file) return `<span class="${cls}"><img src="icons/${file}" alt="" loading="lazy"></span>`;
    return `<span class="${cls}"><span class="ph">${esc((s || "?").charAt(0))}</span></span>`;
  }
  function pityColor(p, hard) {
    const r = p / hard;
    return r < 0.55 ? "var(--good)" : r < 0.8 ? "var(--warn)" : "var(--bad)";
  }
  function fmtTime(t) {
    if (!t) return "";
    const m = t.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    return m ? `${m[1].slice(2)}.${m[2]}.${m[3]} ${m[4]}:${m[5]}` : t;
  }
  function fmtDate(t) {
    const m = t && t.match(/^\d{4}-(\d{2})-(\d{2})/);
    return m ? `${+m[1]}월 ${+m[2]}일` : "";
  }

  // Walk one banner's pulls in order and work out pity, pickups and journey items.
  function build(b) {
    const list = docs.filter((d) => d.banner === b).sort((x, y) => x.seq - y.seq);
    const pulls = [];
    let no = 0, pity = 0;
    for (const d of list) for (const it of d.items || []) {
      const [name, rank, time, flag] = it;
      const gift = flag === 1;
      if (!gift) { no++; pity++; }
      pulls.push({ name, rank, time, flag, gift, no: gift ? null : no, pity: gift ? null : pity, doc: d.id });
      if (flag === 2) pity = 0;
    }
    const pickups = [];
    let journey = [];
    for (const p of pulls) {
      if (p.flag === 2) { pickups.push({ ...p, journey }); journey = []; }
      else if (p.rank === "S" && !p.gift && !isDice(p.name)) journey.push(p);
    }
    const counted = pulls.filter((p) => !p.gift);
    const pityVals = pickups.map((p) => p.pity);
    return {
      pulls, pickups, journey, pity,
      total: counted.length,
      sCount: counted.filter((p) => p.rank === "S").length,
      aCount: counted.filter((p) => p.rank === "A").length,
      avg: pityVals.length ? pityVals.reduce((a, c) => a + c, 0) / pityVals.length : 0,
      min: pityVals.length ? Math.min(...pityVals) : 0,
      max: pityVals.length ? Math.max(...pityVals) : 0,
      last: pulls.length ? pulls[pulls.length - 1].time : "",
    };
  }

  function renderTabs() {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.banner === banner)));
  }

  function render() {
    renderTabs();
    model.char = build("char");
    model.arc = build("arc");
    const m = model[banner];
    const cfg = BANNERS[banner];
    const has = docs.length > 0;
    $("state-msg").hidden = has;
    if (!has && !loading) {
      $("state-msg").innerHTML = loadError
        ? "<b>기록 파일(data.json)을 불러오지 못했어요.</b> 잠시 뒤 새로고침해 주세요."
        : "<b>아직 저장된 기록이 없어요.</b>";
    }
    ["summary", "history-sec", "log-sec"].forEach((id) => ($(id).hidden = !has));
    const tot = model.char.total + model.arc.total;
    $("sync").textContent = has ? `총 ${tot.toLocaleString()}회 · 마지막 기록 ${fmtTime([model.char.last, model.arc.last].sort().pop())}` : "";
    if (!has) return;

    // pity gauge
    $("pity-label").textContent = `${cfg.name} · 현재 천장`;
    $("pity-now").innerHTML = `${m.pity}<small>/ ${cfg.hard}</small>`;
    $("pity-left").textContent = `${Math.max(cfg.hard - m.pity, 0)}회`;
    const pct = Math.min(m.pity / cfg.hard, 1) * 100;
    const fill = $("gauge-fill");
    fill.style.width = pct + "%";
    fill.style.setProperty("--full", pct > 0 ? (100 / pct) * 100 + "%" : "100%");
    $("gauge").querySelectorAll(".soft-tick").forEach((e) => e.remove());
    let marks = `<span style="left:0">0</span>`;
    if (cfg.soft) {
      const tick = document.createElement("span");
      tick.className = "soft-tick";
      tick.style.left = (cfg.soft / cfg.hard) * 100 + "%";
      $("gauge").appendChild(tick);
      marks += `<span style="left:${(cfg.soft / cfg.hard) * 100}%">${cfg.soft} 확률 상승</span>`;
    }
    marks += `<span style="left:100%">${cfg.hard}</span>`;
    $("gauge-marks").innerHTML = marks;
    $("journey").innerHTML = m.journey.length
      ? `<span>이번 여정의 노란 결과</span>` + m.journey.map((p) => `<span class="tag S"><span class="num">${p.pity}</span>${esc(short(p.name))}</span>`).join("")
      : `<span>이번 여정에서 아직 노란 결과가 없어요.</span>`;

    // stats
    const aRate = m.total ? ((m.aCount / m.total) * 100).toFixed(1) : "0.0";
    $("stats").innerHTML = [
      ["총 뽑기", m.total.toLocaleString(), "포인트 선물 제외", ""],
      [`${cfg.pickupWord} 획득`, m.pickups.length, `S급 결과 전체 ${m.sCount}개`, "gold"],
      ["평균 천장", m.avg ? m.avg.toFixed(1) : "–", "픽업 1개당 뽑기", ""],
      ["가장 빨리", m.pickups.length ? m.min : "–", "회 만에 획득", "gold"],
      ["가장 늦게", m.pickups.length ? m.max : "–", "회 만에 획득", ""],
      ["A급", m.aCount, `확률 ${aRate}%`, "rose"],
    ].map(([l, v, e, c]) => `<div class="stat ${c}"><div class="label">${l}</div><b>${v}</b><em>${e}</em></div>`).join("");

    // pickup history, newest first, with the running journey on top
    $("history-title").textContent = `${cfg.pickupWord} 획득 기록`;
    $("history-sub").textContent = m.pickups.length ? `${m.pickups.length}개 · 막대 위 작은 칸은 여정 중 나온 노란 결과` : "";
    const row = (p, cur) => {
      const w = Math.min(p.pity / cfg.hard, 1) * 100;
      const chips = (cur ? m.journey : p.journey).map((j) =>
        `<span class="chip" style="left:${Math.min(j.pity / cfg.hard, 1) * 100}%" title="${j.pity}회: ${esc(short(j.name))}">${ICONS[short(j.name)] ? `<img src="icons/${ICONS[short(j.name)]}" alt="">` : ""}</span>`).join("");
      return `<div class="pull${cur ? " current" : ""}">
        ${cur ? `<span class="icon"><span class="ph">…</span></span>` : icon(p.name, "S")}
        <div class="who"><b>${cur ? "진행 중" : esc(short(p.name))}</b><span>${cur ? "다음 픽업까지" : fmtTime(p.time)}</span></div>
        <div class="bar"><i style="width:${w}%;background:${pityColor(p.pity, cfg.hard)}"></i><div class="chips">${chips}</div></div>
        <div class="pity-badge" style="color:${pityColor(p.pity, cfg.hard)}">${p.pity}</div>
      </div>`;
    };
    $("pulls").innerHTML = (m.pity > 0 || m.journey.length ? row({ pity: m.pity }, true) : "") + m.pickups.slice().reverse().map((p) => row(p)).join("");

    renderLog();
  }

  function renderLog() {
    const m = model[banner];
    const cfg = BANNERS[banner];
    const rows = m.pulls.filter((p) => rankFilter === "all" || p.rank === rankFilter).slice().reverse();
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    page = Math.min(page, pages - 1);
    const slice = rows.slice(page * PAGE, page * PAGE + PAGE);
    $("log-body").innerHTML = slice.map((p) => `
      <tr class="${p.rank}${p.gift ? " gift" : ""}">
        <td class="num muted">${p.gift ? "선물" : p.no}</td>
        <td class="item">${icon(p.name, p.rank, true)}<span>${p.name ? esc(short(p.name)) : "일반 결과"}</span>${p.flag === 2 ? ` <span class="tag S">픽업</span>` : ""}</td>
        <td class="rk ${p.rank}">${p.rank}</td>
        <td class="num" style="color:${p.pity != null ? pityColor(p.pity, cfg.hard) : "var(--dim)"}">${p.pity ?? "–"}</td>
        <td class="num muted">${fmtTime(p.time)}</td>
      </tr>`).join("") || `<tr><td colspan="5" class="muted">조건에 맞는 기록이 없어요.</td></tr>`;
    $("page-info").textContent = `${page + 1} / ${pages} · ${rows.length.toLocaleString()}건`;
    $("prev").disabled = page === 0;
    $("next").disabled = page >= pages - 1;
  }

  // ---------- events ----------
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    banner = t.dataset.banner; page = 0;
    try { localStorage.setItem("nte-banner", banner); } catch (e) {}
    render();
  }));
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    rankFilter = b.dataset.rank; page = 0;
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderLog();
  }));
  $("prev").onclick = () => { page--; renderLog(); };
  $("next").onclick = () => { page++; renderLog(); };

  render();

  // ---------- data ----------
  fetch("data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((list) => { docs = list.map((d, i) => ({ id: d.banner + "-" + d.seq + "-" + i, ...d })); })
    .catch(() => { loadError = true; })
    .finally(() => { loading = false; render(); });
})();
</script>
</body>
</html>
