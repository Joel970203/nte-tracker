<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이환 가챠 트래커</title>
<meta name="description" content="이환(Neverness to Everness) 개인 뽑기 기록과 천장 현황">
<link rel="icon" href="icons/c-nanally.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: night-city tracker. Sticky header with banner switch → hero (latest pickup portrait + segmented pity gauge) beside stat grid
   → pickup card grid + pity distribution → full log table. Gold = S, orchid = A, cyan = interface accent. */
:root {
  color-scheme: dark;
  --bg: #080b11;
  --bg-2: #0d121b;
  --surface: #111724;
  --surface-2: #172031;
  --raise: #1d2738;
  --line: #222c3f;
  --line-2: #2c3850;
  --fg: #e9ecf3;
  --muted: #8d97ad;
  --dim: #5b6479;
  --gold: #f4c656;
  --gold-2: #ffdf8a;
  --gold-soft: rgba(244, 198, 86, .13);
  --orchid: #d98af0;
  --orchid-soft: rgba(217, 138, 240, .13);
  --steel: #7184ab;
  --rose-prize: #ff6fc8;
  --cyan: #5fd2ea;
  --cyan-soft: rgba(95, 210, 234, .12);
  --good: #4fd394;
  --warn: #f1ad42;
  --bad: #f2654f;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Chakra Petch", "IBM Plex Sans KR", ui-monospace, monospace;
  --r: 12px;
  --r-sm: 8px;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(244, 198, 86, .10), transparent 70%),
    radial-gradient(800px 480px at 95% 0%, rgba(95, 210, 234, .08), transparent 70%),
    linear-gradient(var(--bg), var(--bg));
  background-attachment: fixed;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, #000, transparent 60%);
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent 60%);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-2); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(13, 18, 27, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.mark { width: 34px; height: 34px; flex: none; display: grid; place-items: center; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: linear-gradient(135deg, var(--gold), #c98a1d); color: #1a1204; font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.brand-text { min-width: 0; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 11px; background: var(--bg); border: 1px solid var(--line); max-width: 100%; overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 5px 12px 5px 5px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
.tab img { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; filter: grayscale(.7) brightness(.8); transition: filter .15s; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--raise); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }
.tab[aria-selected="true"] img { filter: none; }

.main { padding-block: 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.main > * { min-width: 0; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; color: var(--muted); }
.notice b { color: var(--fg); }

.eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.sec-head p { margin: 0; color: var(--muted); font-size: 12.5px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.pity-card { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--surface-2), var(--surface) 55%); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px 20px; }
.pity-card::before { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(closest-side, var(--glow, rgba(244,198,86,.18)), transparent); pointer-events: none; }
.pity-top { position: relative; display: flex; gap: 18px; align-items: center; }
.portrait { position: relative; width: 84px; height: 84px; flex: none; border-radius: 16px; overflow: hidden; background: var(--surface-2); border: 2px solid var(--gold); box-shadow: 0 0 0 4px var(--gold-soft), 0 10px 30px rgba(0,0,0,.45); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 26px; color: var(--gold); font-weight: 700; }
.pity-read { min-width: 0; flex: 1; }
.pity-read .eyebrow { display: block; margin-bottom: 4px; }
.pity-num { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-family: var(--font-num); }
.pity-num b { font-size: 60px; font-weight: 700; line-height: .95; letter-spacing: -.02em; }
.pity-num span { font-size: 22px; color: var(--dim); font-weight: 600; }
.pity-last { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.pity-last b { color: var(--fg); font-weight: 500; }
.left-chip { margin-left: auto; align-self: flex-start; text-align: right; flex: none; }
.left-chip span { display: block; font-size: 11.5px; color: var(--muted); }
.left-chip b { font-family: var(--font-num); font-size: 26px; font-weight: 700; color: var(--fg); line-height: 1.1; }
.left-chip b small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }

.gauge { position: relative; margin-top: 22px; }
.gauge-track { position: relative; height: 14px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line-2); overflow: hidden; }
.gauge-soft { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(-45deg, rgba(242,101,79,.16) 0 6px, transparent 6px 12px); }
.gauge-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--good), var(--warn) 72%, var(--bad)); background-size: var(--full, 100%) 100%; box-shadow: 0 0 14px rgba(79, 211, 148, .35); }
.gauge-ticks { position: absolute; inset: 0; display: flex; pointer-events: none; }
.gauge-ticks i { flex: 1; border-right: 1px solid rgba(8, 11, 17, .7); }
.gauge-ticks i:last-child { border-right: 0; }
.gauge-scale { position: relative; height: 18px; margin-top: 4px; font-family: var(--font-num); font-size: 11px; color: var(--dim); }
.gauge-scale span { position: absolute; top: 2px; transform: translateX(-50%); }
.gauge-scale span.s0 { transform: none; }
.gauge-scale span.end { transform: translateX(-100%); }
.gauge-scale span.soft { color: var(--bad); }
.journey { position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-num); font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 4px; }
.stat em { font-style: normal; color: var(--muted); font-size: 12px; }
.stat.gold b { color: var(--gold); }
.stat.orchid b { color: var(--orchid); }

/* pickup cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 10px; }
.card { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.card .face { position: relative; width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); grid-row: span 2; }
.card .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .face .ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.card .name { min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: end; }
.card .date { font-family: var(--font-num); font-size: 11.5px; color: var(--dim); align-self: start; }
.card .pity { position: absolute; top: 10px; right: 12px; font-family: var(--font-num); font-weight: 700; font-size: 20px; line-height: 1; }
.card .mini { grid-column: 1 / -1; position: relative; height: 6px; margin-top: 8px; border-radius: 3px; background: var(--bg); }
.card .mini i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.card .mini .dot { position: absolute; top: 50%; width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--gold-2); box-shadow: 0 0 0 2px var(--surface), 0 0 8px rgba(244,198,86,.8); transform: translate(-50%, -50%); cursor: help; transition: transform .12s; }
.card .mini .dot::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
.card .mini .dot:hover, .card .mini .dot:focus-visible, .card .mini .dot.on { transform: translate(-50%, -50%) scale(1.5); outline: none; }
/* costumes are the rare prize: a rose diamond instead of a gold dot */
.card .mini .dot.costume { width: 10px; height: 10px; border-radius: 2px; background: linear-gradient(135deg, #ffd1f1, var(--rose-prize)); box-shadow: 0 0 0 2px var(--surface), 0 0 10px var(--rose-prize), 0 0 18px rgba(255, 92, 190, .55); transform: translate(-50%, -50%) rotate(45deg); z-index: 1; }
.card .mini .dot.costume:hover, .card .mini .dot.costume:focus-visible, .card .mini .dot.costume.on { transform: translate(-50%, -50%) rotate(45deg) scale(1.5); }
.tag.costume { color: var(--rose-prize); background: rgba(255, 92, 190, .12); border-color: color-mix(in srgb, var(--rose-prize) 45%, transparent); }
.tag.costume .num { background: var(--rose-prize); color: #2a0a1f; }
.ic img.obj, .card .face img.obj, .portrait img.obj { object-fit: contain; padding: 3px; }
.tip .cat { display: block; font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }
.tip.costume { border-color: color-mix(in srgb, var(--rose-prize) 60%, var(--line-2)); }
.tip.costume b { color: var(--rose-prize); }
.tip.costume::after { border-color: color-mix(in srgb, var(--rose-prize) 60%, var(--line-2)); }
.tip.costume .ic { border-color: var(--rose-prize); background: rgba(255, 92, 190, .12); }

/* journey tooltip */
.tip { position: fixed; z-index: 20; left: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; max-width: min(280px, calc(100vw - 24px)); background: var(--raise); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line-2)); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.55); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tip.show { opacity: 1; transform: none; }
.tip .ic { width: 36px; height: 36px; }
.tip b { display: block; font-size: 13px; font-weight: 500; color: var(--gold); line-height: 1.3; }
.tip span.when { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-num); }
.tip::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -6px; width: 10px; height: 10px; background: var(--raise); border-right: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line-2)); border-bottom: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line-2)); transform: translateX(-50%) rotate(45deg); }
.tip.below::after { bottom: auto; top: -6px; transform: translateX(-50%) rotate(225deg); }
.card.current { background: transparent; border-style: dashed; }
.card.current .face { border-style: dashed; border-color: var(--line-2); }
.card.current .name { color: var(--muted); }
.card .has-name { padding-right: 34px; }

/* distribution */
.dist-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.dist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 14px; }
.dist h3 { margin: 0 0 14px; font-size: 14px; font-weight: 700; }
.dist-bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 120px; }
.dist-bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.dist-bar i { width: 100%; max-width: 34px; border-radius: 4px 4px 2px 2px; min-height: 2px; }
.dist-bar span { font-family: var(--font-num); font-size: 12px; color: var(--fg); }
.dist-bar span.zero { color: var(--dim); }
.dist-axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
.dist-axis span { text-align: center; font-family: var(--font-num); font-size: 10.5px; color: var(--dim); }
.luck { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; }
.luck-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.luck-row span { color: var(--muted); font-size: 13px; }
.luck-row b { font-family: var(--font-num); font-size: 18px; font-weight: 600; }
.luck-verdict { padding: 10px 12px; border-radius: var(--r-sm); font-size: 13px; line-height: 1.45; }

/* tags */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 3px; border-radius: 999px; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); font-size: 12px; color: var(--gold); white-space: nowrap; }
.tag .num { min-width: 20px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: #1a1204; font-weight: 700; font-size: 11px; display: inline-grid; place-items: center; }
.pick { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #1a1204; background: var(--gold); vertical-align: 1px; }

/* log */
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 6px 13px; color: var(--muted); font-size: 13px; font-family: var(--font-num); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
tr.S { background: linear-gradient(90deg, var(--gold-soft), transparent 45%); }
tr.S td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
tr.A td:first-child { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--orchid) 70%, transparent); }
td.item { display: flex; align-items: center; gap: 10px; }
tr.S td.item .nm { color: var(--gold); font-weight: 500; }
tr.A td.item .nm { color: var(--orchid); }
tr.B td.item .nm { color: var(--muted); }
tr.gift td { opacity: .5; }
.ic { width: 30px; height: 30px; border-radius: 7px; overflow: hidden; flex: none; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); }
.ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ic .ph { font-size: 12px; font-weight: 700; color: var(--muted); }
.ic.S { border-color: color-mix(in srgb, var(--gold) 60%, transparent); background: var(--gold-soft); }
.ic.S .ph { color: var(--gold); }
.ic.A { border-color: color-mix(in srgb, var(--orchid) 50%, transparent); background: var(--orchid-soft); }
.ic.A .ph { color: var(--orchid); }
.rk { font-family: var(--font-num); font-weight: 700; }
.rk.S { color: var(--gold); } .rk.A { color: var(--orchid); } .rk.B { color: var(--steel); }
.muted { color: var(--muted); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--line-2); background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: default; }

.foot { color: var(--dim); font-size: 12px; line-height: 1.6; border-top: 1px solid var(--line); padding-top: 18px; }

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .dist-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .top-in { gap: 10px; }
  .tabs { width: 100%; }
  .tab { flex: 1 1 0; justify-content: center; padding: 5px 6px; font-size: 12.5px; min-width: 0; }
  .tab img { width: 20px; height: 20px; }
  .tab .long { display: none; }
  .pity-card { padding: 18px 16px 16px; }
  .portrait { width: 64px; height: 64px; border-radius: 13px; }
  .pity-num b { font-size: 46px; }
  .left-chip b { font-size: 20px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { grid-template-columns: 42px minmax(0, 1fr); padding: 10px; gap: 2px 10px; }
  .card .face { width: 42px; height: 42px; }
  .card .pity { font-size: 17px; top: 9px; right: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .gauge-fill, .card .mini i, .dist-bar i { transition: width .45s ease, height .45s ease; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">異</div>
      <div class="brand-text"><h1>이환 가챠 트래커</h1><p id="sync">기록 불러오는 중…</p></div>
    </div>
    <div class="tabs" role="tablist" aria-label="배너">
      <button class="tab" role="tab" id="tab-char" aria-selected="true" data-banner="char"><img src="icons/c-akane.webp" alt=""><span>한정<span class="long"> 보드</span></span></button>
      <button class="tab" role="tab" id="tab-arc" aria-selected="false" data-banner="arc"><img src="icons/a-moon.webp" alt=""><span>연구<span class="long"> 모집</span></span></button>
      <button class="tab" role="tab" id="tab-std" aria-selected="false" data-banner="std" hidden><img src="icons/c-hathor.webp" alt=""><span>표준<span class="long"> 보드</span></span></button>
    </div>
  </div>
</header>

<main class="wrap main">
  <div class="notice" id="state-msg"><b>뽑기 기록을 불러오는 중이에요.</b></div>

  <section class="hero" id="hero" hidden>
    <div class="pity-card" id="pity-card">
      <div class="pity-top">
        <div class="portrait" id="portrait"></div>
        <div class="pity-read">
          <span class="eyebrow" id="pity-label">현재 천장</span>
          <div class="pity-num"><b id="pity-now">0</b><span id="pity-hard">/ 90</span></div>
          <div class="pity-last" id="pity-last"></div>
        </div>
        <div class="left-chip"><span>확정까지</span><b id="pity-left">90<small>회</small></b></div>
      </div>
      <div class="gauge">
        <div class="gauge-track"><div class="gauge-soft" id="gauge-soft"></div><div class="gauge-fill" id="gauge-fill"></div><div class="gauge-ticks" id="gauge-ticks"></div></div>
        <div class="gauge-scale" id="gauge-scale"></div>
      </div>
      <div class="journey" id="journey"></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="history-sec" hidden>
    <div class="sec-head"><h2 id="history-title">획득 기록</h2><p id="history-sub"></p></div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="dist-sec" hidden>
    <div class="dist-wrap">
      <div class="dist">
        <h3>몇 번 만에 나왔나</h3>
        <div class="dist-bars" id="dist-bars"></div>
        <div class="dist-axis" id="dist-axis"></div>
      </div>
      <div class="luck" id="luck"></div>
    </div>
  </section>

  <section id="log-sec" hidden>
    <div class="sec-head">
      <h2>전체 뽑기 로그</h2>
      <div class="seg" role="group" aria-label="등급 필터">
        <button type="button" data-rank="all" aria-pressed="true">ALL</button>
        <button type="button" data-rank="S" aria-pressed="false">S</button>
        <button type="button" data-rank="A" aria-pressed="false">A</button>
        <button type="button" data-rank="B" aria-pressed="false">B</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>아이템</th><th>등급</th><th>천장</th><th>시간</th></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
    <div class="pager"><button class="btn" type="button" id="prev">← 최근</button><span id="page-info" class="num"></span><button class="btn" type="button" id="next">이전 →</button></div>
  </section>

  <p class="foot">천장 기준: 한정·표준 보드 90회(70회부터 확률 상승), 연구 모집 80회. 픽뚫이 없어서 노란 캐릭터가 나오면 천장이 초기화돼요. 포인트 선물과 안식의 땅 보너스는 뽑기가 아니라서 횟수에서 빠져요.<br>아이콘 출처: Icy Veins, Game8, GameWith · 개인용 비공식 팬 트래커</p>
</main>

<script>
(() => {
  const BANNERS = {
    char: { name: "한정 보드", hard: 90, soft: 70, pickupWord: "캐릭터" },
    arc: { name: "연구 모집", hard: 80, soft: null, pickupWord: "전용 아크" },
    std: { name: "표준 보드", hard: 90, soft: 70, pickupWord: "S급 캐릭터" },
  };
  const ICONS = {
    "나나리": "c-nanally.webp", "호토리": "c-hotori.webp", "라크리모사": "c-lacrimosa.webp", "카오스": "c-chaos.webp",
    "신쿠": "c-shinku.webp", "일로이": "c-iroi.webp", "잔홍": "c-zankou.webp", "링코": "c-linko.webp",
    "레이븐": "c-blackbird.webp", "아카네 린": "c-akane.webp", "민트": "c-mint.webp", "스키아": "c-skia.webp",
    "아들러": "c-adler.webp", "에드가": "c-edgar.webp", "하니엘": "c-haniel.webp",
    "구원": "c-jiuyuan.webp", "사키리": "c-sakiri.webp", "백장": "c-baicang.webp", "하토르": "c-hathor.webp",
    "준비 준비": "a-ready.png", "시간 밖으로의 행진": "a-marching.png", "마지막 장미": "a-lastrose.png",
    "만인의 갈망": "a-desired.png", "홍염의 신기루": "a-blushing.png", "금기의 문": "a-wronggate.png",
    "심장을 좀먹는 칼": "a-ravenous.png", "원행자의 목소리": "a-voyager.png", "죄와 벌": "a-crime.png",
    "달의 대척점": "a-moon.webp", "염혼의 질주": "a-raging.png", "동백꽃 모임": "a-camellia.png",
    "착한 강아지의 여행": "a-goodboy.png", "암흑 청춘의 망상": "a-youthful.png", "현실 도피처": "a-refuge.png",
    "물망산": "a-umbrella.png", "머리 조심": "a-heads.png", "잊힌 자": "a-forgotten.png",
    "잊혀진 자": "a-forgotten.png", "발도": "a-drawn.png", "위험한 게임": "a-dangerous.png", "미소 천사": "a-behappy.png",
    "우리": "a-us.png", "광란의 전자음악": "a-realmusic.png", "성공을 향한 첫 걸음": "a-firststep.png",
    "정화 개시": "a-clearskies.png", "우미츠키": "c-aurelia.webp",
    "탈차원 가물": "i-warp.webp", "방향처 가물": "i-lost.webp", "진실의 주사위": "i-dice-solid.webp", "기만의 주사위": "i-dice-fab.webp",
    "가을의 여운-리버리": "l-autumnhaze.webp", "밤하늘의 깃털-리버리": "l-nightplume.webp", "빙글빙글 링코-세트": "l-turbolinko.webp",
    "토마토 크루즈-리버리": "l-tomatocruise.webp", "하얀 모래의 신기루-리버리": "l-sandymirage.webp",
    "가을의 여유": "o-autumnvignette.webp", "우주 여행": "o-surfingstars.webp",
    "방황의 날": "g-dayadrift.webp", "슈퍼 악령 납시오": "g-superspecter.webp", "양 헬리콥터": "g-sheepcopter.webp", "유란": "g-orchid.webp",
    "적련": "g-scarlet.webp", "징조의 새": "g-harbinger.webp", "토마토 듀오": "g-tomatoduo.webp", "해를 삼킨 그림자": "g-overcast.webp",
  };
  const PAGE = 50;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const short = (n) => (n || "").replace(/^(캐릭터|아크|아이템|튜닝 부품|코스튬|글라이딩 날개)·/, "");
  const category = (n) => { const m = (n || "").match(/^(캐릭터|아크|아이템|튜닝 부품|코스튬|글라이딩 날개)·/); return m ? m[1] : ""; };
  const isCostume = (n) => category(n) === "코스튬";
  const isDice = (n) => /주사위$/.test(short(n));
  const iconFile = (n) => ICONS[short(n)];

  let banner = "char", rankFilter = "all", page = 0;
  let docs = [], loading = true, loadError = false;
  const model = {};

  try { const b = localStorage.getItem("nte-banner"); if (b in BANNERS) banner = b; } catch (e) {}
  if (location.hash.slice(1) in BANNERS) banner = location.hash.slice(1);

  const img = (n) => {
    const f = iconFile(n);
    if (!f) return `<span class="ph">${esc((short(n) || "?").charAt(0))}</span>`;
    return `<img src="icons/${f}" alt="" loading="lazy"${/^[ilg]-/.test(f) ? ' class="obj"' : ""}>`;
  };
  const pityColor = (p, hard) => { const r = p / hard; return r < 0.55 ? "var(--good)" : r < 0.8 ? "var(--warn)" : "var(--bad)"; };
  function fmtTime(t) {
    const m = t && t.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    return m ? `${m[1].slice(2)}.${m[2]}.${m[3]} ${m[4]}:${m[5]}` : (t || "");
  }
  function fmtDay(t) {
    const m = t && t.match(/^\d{4}-(\d{2})-(\d{2})/);
    return m ? `${+m[1]}월 ${+m[2]}일` : "";
  }

  // Walk one banner's pulls in order and work out pity, pickups and journey items.
  function build(b) {
    const list = docs.filter((d) => d.banner === b).sort((x, y) => x.seq - y.seq);
    const pulls = [];
    let no = 0, pity = 0;
    for (const d of list) for (const [name, rank, time, flag] of d.items || []) {
      const gift = flag === 1 || flag === 3;
      if (!gift) { no++; pity++; }
      pulls.push({ name, rank, time, flag, gift, no: gift ? null : no, pity: gift ? null : pity });
      if (flag === 2) pity = 0;
    }
    const pickups = [];
    let journey = [];
    for (const p of pulls) {
      if (p.flag === 2) { pickups.push({ ...p, journey }); journey = []; }
      else if (p.rank === "S" && !p.gift && !isDice(p.name)) journey.push(p);
    }
    const counted = pulls.filter((p) => !p.gift);
    const vals = pickups.map((p) => p.pity);
    return {
      pulls, pickups, journey, pity,
      total: counted.length,
      sCount: counted.filter((p) => p.rank === "S").length,
      aCount: counted.filter((p) => p.rank === "A").length,
      avg: vals.length ? vals.reduce((a, c) => a + c, 0) / vals.length : 0,
      min: vals.length ? Math.min(...vals) : 0,
      max: vals.length ? Math.max(...vals) : 0,
      last: pulls.length ? pulls[pulls.length - 1].time : "",
    };
  }

  function render() {
    for (const b in BANNERS) model[b] = build(b);
    $("tab-std").hidden = !model.std.total;
    if (!loading && !model[banner].total && model.char.total) banner = "char";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.banner === banner)));

    const has = docs.length > 0;
    $("state-msg").hidden = has;
    if (!has && !loading) {
      $("state-msg").innerHTML = loadError
        ? "<b>기록 파일(data.json)을 불러오지 못했어요.</b> 잠시 뒤 새로고침해 주세요."
        : "<b>아직 저장된 기록이 없어요.</b>";
    }
    ["hero", "history-sec", "dist-sec", "log-sec"].forEach((id) => ($(id).hidden = !has));
    const all = Object.values(model);
    const tot = all.reduce((a, x) => a + x.total, 0);
    $("sync").textContent = has ? `총 ${tot.toLocaleString()}회 · 마지막 기록 ${fmtTime(all.map((x) => x.last).sort().pop())}` : "기록 불러오는 중…";
    if (!has) return;

    const m = model[banner], cfg = BANNERS[banner];
    const latest = m.pickups[m.pickups.length - 1];

    // hero
    $("portrait").innerHTML = latest ? img(latest.name) : `<span class="ph">?</span>`;
    $("pity-label").textContent = `${cfg.name} · 현재 천장`;
    $("pity-now").textContent = m.pity;
    $("pity-now").style.color = m.pity ? pityColor(m.pity, cfg.hard) : "var(--fg)";
    $("pity-hard").textContent = `/ ${cfg.hard}`;
    $("pity-last").innerHTML = latest ? `마지막 획득 <b>${esc(short(latest.name))}</b> · ${fmtDay(latest.time)} · ${latest.pity}회 만에` : "아직 픽업 획득 기록이 없어요";
    $("pity-left").innerHTML = `${Math.max(cfg.hard - m.pity, 0)}<small>회</small>`;
    const pct = Math.min(m.pity / cfg.hard, 1) * 100;
    $("gauge-fill").style.width = pct + "%";
    $("gauge-fill").style.setProperty("--full", pct > 0 ? (10000 / pct) + "%" : "100%");
    $("gauge-soft").style.left = cfg.soft ? (cfg.soft / cfg.hard) * 100 + "%" : "100%";
    $("gauge-ticks").innerHTML = "<i></i>".repeat(Math.ceil(cfg.hard / 10));
    let scale = `<span class="s0" style="left:0">0</span>`;
    for (let v = 20; v < cfg.hard - 5; v += 20) if (!(cfg.soft && Math.abs(v - cfg.soft) < 8)) scale += `<span style="left:${(v / cfg.hard) * 100}%">${v}</span>`;
    if (cfg.soft) scale += `<span class="soft" style="left:${(cfg.soft / cfg.hard) * 100}%">${cfg.soft}</span>`;
    scale += `<span class="end" style="left:100%">${cfg.hard}</span>`;
    $("gauge-scale").innerHTML = scale;
    $("journey").innerHTML = m.journey.length
      ? `<span>이번 여정의 노란 결과</span>` + m.journey.map((p) => `<span class="tag${isCostume(p.name) ? " costume" : ""}"><span class="num">${p.pity}</span>${esc(short(p.name))}</span>`).join("")
      : `<span>이번 여정에서 아직 노란 결과가 없어요</span>`;
    $("pity-card").style.setProperty("--glow", m.pity / cfg.hard >= 0.8 ? "rgba(242,101,79,.20)" : "rgba(244,198,86,.18)");

    const aRate = m.total ? ((m.aCount / m.total) * 100).toFixed(1) : "0.0";
    $("stats").innerHTML = [
      ["총 뽑기", m.total.toLocaleString(), "포인트 선물 제외", ""],
      [`${cfg.pickupWord}`, m.pickups.length, `노란 결과 전체 ${m.sCount}개`, "gold"],
      ["평균 천장", m.avg ? m.avg.toFixed(1) : "–", "픽업 1개당 뽑기", ""],
      ["가장 빨리", m.pickups.length ? m.min : "–", "회 만에 획득", "gold"],
      ["가장 늦게", m.pickups.length ? m.max : "–", "회 만에 획득", ""],
      ["A급", m.aCount, `${aRate}% 확률`, "orchid"],
    ].map(([l, v, e, c]) => `<div class="stat ${c}"><span class="eyebrow">${l}</span><b>${v}</b><em>${e}</em></div>`).join("");

    // pickup cards, newest first, with the running journey first
    $("history-title").textContent = `${cfg.pickupWord} 획득 기록`;
    $("history-sub").textContent = m.pickups.length ? `${m.pickups.length}개 · 막대 위 점은 여정 중 나온 노란 결과` : "";
    const card = (p, cur) => {
      const col = pityColor(p.pity, cfg.hard);
      const dots = (cur ? m.journey : p.journey).map((j) => `<button type="button" class="dot${isCostume(j.name) ? " costume" : ""}" style="left:${Math.min(j.pity / cfg.hard, 1) * 100}%" data-name="${esc(j.name)}" data-pity="${j.pity}" data-time="${esc(j.time || "")}" aria-label="${j.pity}회째 ${esc(short(j.name))}"></button>`).join("");
      return `<div class="card${cur ? " current" : ""}">
        <div class="face">${cur ? `<span class="ph">?</span>` : img(p.name)}</div>
        <div class="name has-name">${cur ? "진행 중" : esc(short(p.name))}</div>
        <div class="date">${cur ? "다음 픽업까지" : fmtTime(p.time)}</div>
        <div class="pity" style="color:${col}">${p.pity}</div>
        <div class="mini"><i style="width:${Math.min(p.pity / cfg.hard, 1) * 100}%;background:${col}"></i>${dots}</div>
      </div>`;
    };
    $("cards").innerHTML = (m.pity > 0 ? card({ pity: m.pity }, true) : "") + m.pickups.slice().reverse().map((p) => card(p)).join("");

    // distribution in 10-pull buckets
    const buckets = [];
    for (let s = 1; s <= cfg.hard; s += 10) buckets.push({ lo: s, hi: Math.min(s + 9, cfg.hard), n: 0 });
    const over = { lo: cfg.hard + 1, hi: Infinity, n: 0 };
    m.pickups.forEach((p) => { const b = buckets.find((x) => p.pity >= x.lo && p.pity <= x.hi); (b || over).n++; });
    if (over.n) buckets.push(over);
    const peak = Math.max(1, ...buckets.map((b) => b.n));
    $("dist-bars").innerHTML = buckets.map((b) => `<div class="dist-bar"><span class="${b.n ? "" : "zero"}">${b.n}</span><i style="height:${(b.n / peak) * 92}%;background:${b.n ? pityColor(Math.min(b.hi, cfg.hard), cfg.hard) : "var(--line)"}"></i></div>`).join("");
    $("dist-axis").innerHTML = buckets.map((b) => `<span>${b.hi === Infinity ? cfg.hard + "+" : b.hi}</span>`).join("");

    const early = m.pickups.filter((p) => p.pity <= cfg.hard * 0.55).length;
    const late = m.pickups.filter((p) => p.pity >= cfg.hard * 0.8).length;
    const ratio = m.avg / cfg.hard;
    const verdict = !m.pickups.length ? ["아직 판단할 기록이 없어요.", "var(--surface-2)", "var(--muted)"]
      : ratio < 0.6 ? [`평균 ${m.avg.toFixed(1)}회로 천장(${cfg.hard})까지 한참 남기고 뽑고 있어요. 운이 좋은 편이에요.`, "rgba(79,211,148,.12)", "var(--good)"]
      : ratio < 0.8 ? [`평균 ${m.avg.toFixed(1)}회, 확률 상승 구간 근처에서 주로 나왔어요. 평범한 운이에요.`, "rgba(241,173,66,.12)", "var(--warn)"]
      : [`평균 ${m.avg.toFixed(1)}회로 대부분 천장 가까이 가서 나왔어요.`, "rgba(242,101,79,.12)", "var(--bad)"];
    $("luck").innerHTML = `
      <span class="eyebrow">운 요약</span>
      <div class="luck-row"><span>빨리 나옴 (${Math.round(cfg.hard * 0.55)}회 이하)</span><b style="color:var(--good)">${early}</b></div>
      <div class="luck-row"><span>천장 근처 (${Math.ceil(cfg.hard * 0.8)}회 이상)</span><b style="color:var(--bad)">${late}</b></div>
      <div class="luck-row"><span>진행 중 천장</span><b>${m.pity} / ${cfg.hard}</b></div>
      <div class="luck-verdict" style="background:${verdict[1]};color:${verdict[2]}">${verdict[0]}</div>`;

    renderLog();
  }

  function renderLog() {
    const m = model[banner], cfg = BANNERS[banner];
    const rows = m.pulls.filter((p) => rankFilter === "all" || p.rank === rankFilter).slice().reverse();
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    page = Math.max(0, Math.min(page, pages - 1));
    $("log-body").innerHTML = rows.slice(page * PAGE, page * PAGE + PAGE).map((p) => `
      <tr class="${p.rank}${p.gift ? " gift" : ""}">
        <td class="num muted">${p.flag === 3 ? "보너스" : p.gift ? "선물" : p.no}</td>
        <td class="item"><span class="ic ${p.rank}">${img(p.name)}</span><span class="nm">${p.name ? esc(short(p.name)) : "일반 결과"}</span>${p.flag === 2 ? `<span class="pick">PICK UP</span>` : ""}</td>
        <td class="rk ${p.rank}">${p.rank}</td>
        <td class="num" style="color:${p.pity != null ? pityColor(p.pity, cfg.hard) : "var(--dim)"}">${p.pity ?? "–"}</td>
        <td class="num muted">${fmtTime(p.time)}</td>
      </tr>`).join("") || `<tr><td colspan="5" class="muted">조건에 맞는 기록이 없어요.</td></tr>`;
    $("page-info").textContent = `${page + 1} / ${pages} · ${rows.length.toLocaleString()}건`;
    $("prev").disabled = page === 0;
    $("next").disabled = page >= pages - 1;
  }

  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    banner = t.dataset.banner; page = 0;
    try { localStorage.setItem("nte-banner", banner); } catch (e) {}
    history.replaceState(null, "", "#" + banner);
    render();
  }));
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    rankFilter = b.dataset.rank; page = 0;
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderLog();
  }));
  $("prev").onclick = () => { page--; renderLog(); };
  $("next").onclick = () => { page++; renderLog(); };

  // tooltip for journey dots: hover on desktop, tap on phones
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  let tipDot = null;
  function showTip(dot) {
    if (tipDot && tipDot !== dot) tipDot.classList.remove("on");
    tipDot = dot;
    dot.classList.add("on");
    const name = dot.dataset.name;
    const cat = category(name);
    tip.classList.toggle("costume", isCostume(name));
    tip.innerHTML = `<span class="ic S">${img(name)}</span><span>${cat ? `<span class="cat">${esc(cat)}</span>` : ""}<b>${esc(short(name))}</b><span class="when">${dot.dataset.pity}회째 · ${fmtTime(dot.dataset.time)}</span></span>`;
    tip.classList.add("show");
    const r = dot.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const cx = r.left + r.width / 2;
    const x = Math.max(12, Math.min(cx - w / 2, innerWidth - w - 12));
    const below = r.top - h - 12 < 0;
    tip.classList.toggle("below", below);
    tip.style.left = x + "px";
    tip.style.top = (below ? r.bottom + 12 : r.top - h - 12) + "px";
    tip.style.setProperty("--arrow", cx - x + "px");
  }
  function hideTip() {
    tip.classList.remove("show");
    if (tipDot) tipDot.classList.remove("on");
    tipDot = null;
  }
  const cards = $("cards");
  cards.addEventListener("pointerover", (e) => { const d = e.target.closest(".dot"); if (d && e.pointerType === "mouse") showTip(d); });
  cards.addEventListener("pointerout", (e) => { const d = e.target.closest(".dot"); if (d && e.pointerType === "mouse" && !d.contains(e.relatedTarget)) hideTip(); });
  cards.addEventListener("focusin", (e) => { const d = e.target.closest(".dot"); if (d) showTip(d); });
  cards.addEventListener("focusout", hideTip);
  document.addEventListener("click", (e) => {
    const d = e.target.closest(".dot");
    if (d) { e.preventDefault(); tipDot === d && tip.classList.contains("show") ? hideTip() : showTip(d); }
    else hideTip();
  });
  addEventListener("scroll", hideTip, { passive: true });
  addEventListener("resize", hideTip);

  render();
  fetch("data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((list) => { docs = list; })
    .catch(() => { loadError = true; })
    .finally(() => { loading = false; render(); });
})();
</script>
</body>
</html>
